<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Espace professionnel — Deltasoins 13010</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%234f9d94%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!--
  Portail d'accès à usage interne : propose simplement le choix entre la version bureau et la version
  mobile de l'outil de planning/facturation. Pas de code d'accès ici — inutile depuis que l'outil lui-même
  demande un compte (email/mot de passe via Supabase) pour accéder aux données. La vraie protection des
  données se fait donc en aval, sur chaque outil :
  - Version bureau (JD_Consult_Planning.html) et version mobile (JD_Consult_Planning_Mobile.html) :
    compte email/mot de passe (Supabase), données patients et ordonnances synchronisées en ligne sur ce
    compte + copie locale hors connexion. Vérifier que la sécurité entre comptes (Row Level Security) est
    bien activée côté Supabase avant d'y saisir de vraies données patients.

  Cette page n'apparaît pas dans sitemap.xml et est exclue de l'indexation via robots.txt + la balise
  meta robots ci-dessus.
-->
</head>
<body>

<main class="gate">
  <div class="gate__delta" aria-hidden="true"></div>
  <div class="gate__card">
    <a href="index.html" class="wordmark" aria-label="Deltasoins, accueil"><span class="wordmark__delta" aria-hidden="true"></span>deltasoins</a>
    <h1 style="margin-top:2rem">Planning et facturation</h1>
    <p>Choisissez votre version. La connexion à votre compte est demandée ensuite.</p>
    <div class="gate__choices">
      <a class="button" href="JD_Consult_Planning.html" id="linkDesktop">Version bureau, grille du mois</a>
      <a class="button" href="JD_Consult_Planning_Mobile.html" id="linkMobile">Version mobile, roulement</a>
    </div>
    <p class="gate__hint" id="autoHint"></p>
    <p class="gate__hint">Outil interne, usage professionnel uniquement.</p>
  </div>
</main>

<script>
  // Suggestion automatique selon la taille d'écran (téléphone -> mobile, sinon bureau), tout en
  // laissant les deux liens cliquables pour changer d'avis à tout moment.
  const isPhone = window.matchMedia('(max-width: 600px)').matches;
  document.getElementById('autoHint').textContent = isPhone
    ? 'Sur téléphone, la version mobile est recommandée.'
    : 'Sur ordinateur, la version bureau est recommandée.';
  document.getElementById(isPhone ? 'linkMobile' : 'linkDesktop').classList.add('is-pref');
</script>

</body>
</html>
